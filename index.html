<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Road to Target</title>
  <style>
    :root{--navy:#1B1340;--purple:#451DC7;--lilac:#EEEAFB;--white:#fff;--muted:#655f7b;--green:#198754;--red:#b42318;--amber:#9a6700;--line:#ddd6f2}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy);background:#f7f6fc}button,input,select,textarea{font:inherit}button{cursor:pointer}.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;z-index:9;background:#fff;padding:.5rem}.app{max-width:1360px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:1rem;align-items:center;background:var(--navy);color:#fff;padding:24px 28px;border-radius:20px}.hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.7rem)}.hero p{margin:.25rem 0 0;color:#dcd6ff}.role-switch{display:flex;gap:8px;flex-wrap:wrap}.role-switch button,.primary{background:var(--purple);color:#fff;border:0;border-radius:9px;padding:.65rem .9rem;font-weight:700}.role-switch button.active{background:#fff;color:var(--navy)}.notice{background:#fff6d8;border:1px solid #f5d56d;padding:.7rem 1rem;border-radius:10px;margin:16px 0;color:#614500}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:.6rem .8rem}.tabs button.active{background:var(--navy);color:#fff}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);box-shadow:0 5px 17px #1b134010;border-radius:16px;padding:20px}.card h2,.card h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}label{font-weight:650;display:block}input,select,textarea{width:100%;margin-top:5px;padding:.62rem .7rem;border:1px solid #b9b1d0;border-radius:8px;background:#fff;color:var(--navy)}textarea{min-height:75px}button.secondary{background:#fff;color:var(--purple);border:1px solid var(--purple);border-radius:9px;padding:.6rem .8rem;font-weight:700}button.danger{background:var(--red);color:#fff;border:0;border-radius:9px;padding:.6rem .8rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.help,.muted{color:var(--muted);font-size:.88rem}.error{color:var(--red);font-weight:650}.success{color:var(--green);font-weight:650}.progress-item{margin:14px 0}.progress-label{display:flex;justify-content:space-between;gap:1rem;font-weight:700}.bar{height:12px;background:var(--lilac);border-radius:99px;overflow:hidden;margin-top:6px}.bar>span{height:100%;display:block;background:linear-gradient(90deg,var(--purple),#8563ee);border-radius:inherit;transition:width .5s}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{border-radius:99px;padding:.35rem .65rem;font-size:.85rem;font-weight:750;background:#eee;color:#514b61}.badge.bronze{background:#f4dfcf;color:#743b0d}.badge.silver{background:#e5e8ee;color:#3d4756}.badge.gold{background:#fff0ba;color:#785500}.badge.earned{box-shadow:0 0 0 3px #451dc733}.status{font-size:.8rem;font-weight:750;padding:.25rem .5rem;border-radius:99px;display:inline-block}.Draft{background:#e7e4ef}.Submitted{background:#fff0ba;color:#725700}.Approved{background:#d9f5e6;color:#086837}.Rejected{background:#ffe2df;color:#a5261b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;color:var(--muted)}.table-wrap{overflow:auto}.empty{padding:20px;text-align:center;color:var(--muted)}.drop{border:2px dashed #9e8be3;border-radius:12px;padding:20px;text-align:center;background:#fbfaff}.toast{position:fixed;right:20px;bottom:20px;max-width:380px;background:var(--navy);color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 24px #0004;z-index:10}.celebrate{animation:pop .8s ease-in-out 2}@keyframes pop{50%{transform:scale(1.04);box-shadow:0 0 0 9px #eacb45aa}}.hidden{display:none!important}.filter-row{display:flex;gap:8px;flex-wrap:wrap}.filter-row>*{width:auto;min-width:140px;margin:0}@media(max-width:760px){.app{padding:12px}.hero{padding:18px;display:block}.role-switch{margin-top:12px}.grid.two,.grid.three,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}th,td{padding:8px 6px}.mobile-hide{display:none}}
  </style>
</head>
<body><a class="skip" href="#main">Skip to content</a><main id="main" class="app">
  <header class="hero"><div><h1>Road to Target</h1><p>Back on Track • Luxembourg • 1 October – 31 December 2026</p></div><div class="role-switch" aria-label="Choose workspace"><button data-role="contributor">Contributor</button><button data-role="reviewer">Reviewer</button></div></header>
  <p class="notice"><strong>Demo access only:</strong> choosing a role is not a security control. Do not store confidential information in this browser-only app.</p>
  <nav id="tabs" class="tabs" aria-label="App sections"></nav><section id="view"></section>
</main><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='roadToTarget.v1', SCHEMA='road-to-target', VERSION=1;
const TARGETS={Analyst:[54,4],Consultant:[50,8],'Senior Consultant':[45,20],Manager:[33,40],'Senior Manager':[20,60]};
const DEFAULT=[
['Delivery','Billable day',1,'day',''],['Delivery','Fully billable month bonus',5,'count',''],['Delivery','Extension or new phase signed',3,'count',''],
['Sales','Client prospection with concrete output',1,'count',''],['Sales','Pitch to existing partner',.5,'count',''],['Sales','Pitch to new prospect',1,'count',''],['Sales','Pitch to new client leading to a concrete project meeting',2,'count',''],['Sales','Organising a pitch for management',1,'count',''],['Sales','Opportunity logged in CRM',1,'count',''],['Sales','Lead for another BU that becomes a proposal',2,'count',''],
['Proposals','Quality review',.5,'count',''],['Proposals','Proposal writing',1,'day','5 per bid'],['Proposals','Bid manager',3,'count',''],['Proposals','Proposal shortlisted',1,'count',''],['Proposals','Proposal won',5,'count',''],['Proposals','Framework contract or lot won',8,'count',''],['Proposals','Lessons learned after a loss',.5,'count',''],
['Visibility','Event in Luxembourg',1,'day',''],['Visibility','Event outside Luxembourg',2,'day',''],['Visibility','Event debrief with 3+ qualified contacts',1,'count',''],['Visibility','Speaker or panelist',4,'count',''],['Visibility','LinkedIn post',.5,'count','2 per month'],['Visibility','Article, webinar or white paper',3,'count',''],
['Capability and team spirit','Certification',3,'count',''],['Capability and team spirit','Business Academy module',1,'count',''],['Capability and team spirit','Reusable asset validated',2,'count',''],['Capability and team spirit','Internal training given',2,'count',''],['Capability and team spirit',"Help on a colleague's bid",1,'count','2 per month'],
['Internal life','Leading a Wellness Champion or LOL activity',2,'count',''],['Internal life','Organising an internal event',2,'count',''],['Internal life','Taking part in an internal event',.5,'count',''],['Internal life','Presentation at a cyber team meeting',1,'count',''],['Internal life','Helping with WESKI organisation',2,'count',''],['Internal life','Onboarding buddy',1,'count','']
].map((x,i)=>({id:'act-'+(i+1),category:x[0],label:x[1],points:x[2],unit:x[3],cap:x[4],active:true}));
let db=load(), role='contributor', tab='dashboard';
function blank(){return {schemaVersion:VERSION,type:'local',catalogueVersion:1,catalogue:DEFAULT,profile:{name:'',email:'',grade:'Consultant',reviewer:''},entries:[],audit:[]}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.schemaVersion===VERSION?d:blank()}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function now(){return new Date().toISOString()}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),4000)}function $(s,r=document){return r.querySelector(s)}function $$(s,r=document){return [...r.querySelectorAll(s)]}function date(){return new Date().toISOString().slice(0,10)}function month(d){return (d||'').slice(0,7)}function fmt(n){return (+n||0).toLocaleString('en-US',{maximumFractionDigits:1})}
function dl(name,data,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function valid(x,type){if(!x||x.schemaVersion!==VERSION||x.app!==SCHEMA)throw Error('Unsupported file. Expected a Road to Target JSON file (schema version '+VERSION+').');if(type&&x.type!==type)throw Error('This file is not a '+type+' export.');return x}
function profileReady(){return Boolean(db.profile.name.trim()&&db.profile.email.trim()&&db.profile.grade)}function person(e){return e.person?.name||db.profile.name||'Unknown'}function activity(e){return db.catalogue.find(a=>a.id===e.activityId)||e.activity||{label:'Unknown',category:'Unknown',points:0}}
function totalFor(entries,profile){let d=0,b=0,internal=0;entries.filter(e=>e.status==='Approved'||(profile===db.profile&&e.status==='Draft')).forEach(e=>{let a=activity(e),p=+e.awardedPoints||+e.points||0;if(a.category==='Delivery')d+=p;else if(a.category==='Internal life'){let add=Math.min(p,Math.max(0,10-internal));internal+=add;b+=add}else b+=p});return {d,b,t:d+b}}
function target(p=db.profile){let x=TARGETS[p.grade]||[0,0];return {d:x[0],b:x[1],t:x[0]+x[1]}}function level(p){let q=totalFor(db.entries,p),t=target(p);let v=Math.min(q.d/t.d||0,q.b/t.b||0)*100;return v>=130?'Gold':v>=115?'Silver':v>=100?'Bronze':'On track'}
function render(){let tabs=role==='contributor'?['dashboard','add','activities','profile','data']:['catalogue','import','queue','merge','leaderboard','data'];if(!tabs.includes(tab))tab=tabs[0];$('#tabs').innerHTML=tabs.map(x=>`<button class="${x===tab?'active':''}" data-tab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('');$('#view').innerHTML=(role==='contributor'?contrib:review)[tab]();bind()}
function layout(title,body){return `<div class="card"><h2>${title}</h2>${body}</div>`}
const contrib={
dashboard(){let q=totalFor(db.entries,db.profile),t=target(),pct=Math.min(q.d/t.d||0,q.b/t.b||0)*100,l=level(db.profile),m=new Date().getMonth();let cp=m===9?33:m===10?66:100;return `<div class="grid two"><div class="card ${l!=='On track'?'celebrate':''}"><h2>Hello, ${esc(db.profile.name||'Contributor')}</h2><p class="muted">Your reward depends on reaching both delivery and business targets.</p>${[['Delivery',q.d,t.d],['Business',q.b,t.b],['Total',q.t,t.t]].map(x=>`<div class="progress-item"><div class="progress-label"><span>${x[0]}</span><span>${fmt(x[1])} / ${x[2]} (${fmt(x[1]/x[2]*100)}%)</span></div><div class="bar"><span style="width:${Math.min(100,x[1]/x[2]*100)}%"></span></div></div>`).join('')}<div class="badges"><span class="badge bronze ${pct>=100?'earned':''}">Bronze 100%</span><span class="badge silver ${pct>=115?'earned':''}">Silver 115%</span><span class="badge gold ${pct>=130?'earned':''}">Gold 130%</span></div><p><strong>Current level: ${l}</strong> · qualifying progress: ${fmt(pct)}%</p></div><div class="card"><h2>Checkpoint guidance</h2><p>End Oct: 33% · End Nov: 66% · End Dec: 100%</p><div class="progress-item"><div class="progress-label"><span>Current guidance</span><span>${fmt(pct)}% / ${cp}%</span></div><div class="bar"><span style="width:${Math.min(100,pct/cp*100)}%"></span></div></div><p class="${pct>=cp?'success':'muted'}">${pct>=cp?'You are meeting the guidance checkpoint.':'Keep going — this is guidance, not a hard deadline.'}</p><p class="help">Approved activities count officially. Draft activities are shown here to help you plan.</p></div></div>`},
add(){if(!profileReady())return layout('Complete your profile first',`<p>Your name, email, and grade are required before activities can be created. This makes sure every activity is linked to you and appears in your activity list.</p><button id="goProfile" class="primary">Complete profile</button>`);let cats=[...new Set(db.catalogue.filter(a=>a.active).map(a=>a.category))];return layout('Add activity',`<form id="activityForm" class="form-grid"><label>Category<select id="category">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Activity<select id="activity"></select></label><label>Date<input id="entryDate" type="date" min="2026-10-01" max="2026-12-31" value="${date()}" required></label><label>Quantity<input id="quantity" type="number" min="0.1" step="0.1" value="1" required></label><label class="wide">Short proof <input id="proof" required maxlength="160" placeholder="Meeting title, proposal name, event name…"></label><label class="wide">Optional comment<textarea id="comment" maxlength="500"></textarea></label><div class="wide"><strong id="pointsPreview">0 points</strong><p id="capWarning" class="error"></p></div><button class="primary">Save as draft</button></form>`)},
activities(){let es=db.entries.filter(e=>!e.person||e.person.email===db.profile.email);return layout('My activities',table(es,true))},
profile(){return layout('My profile',`<form id="profileForm" class="form-grid"><label>Name<input name="name" value="${esc(db.profile.name)}" required></label><label>Email<input name="email" type="email" value="${esc(db.profile.email)}" required></label><label>Grade<select name="grade">${Object.keys(TARGETS).map(g=>`<option ${g===db.profile.grade?'selected':''}>${g}</option>`).join('')}</select></label><label>Reviewer name<input name="reviewer" value="${esc(db.profile.reviewer)}"></label><button class="primary">Save profile</button></form>`)},
data(){return layout('Exchange & local data',`<p>Submit your drafts to a reviewer as a JSON file. Import a previously exported submission, catalogue, or reviewed file without overwriting unrelated local data.</p><div class="actions"><button id="exportSubmission" class="primary">Export my submission</button><label class="secondary">Import my submission<input id="mySubmissionFile" type="file" accept="application/json" hidden></label><label class="secondary">Import catalogue<input id="catalogueFile" type="file" accept="application/json" hidden></label><label class="secondary">Import reviewed file<input id="reviewedFile" type="file" accept="application/json" hidden></label><button id="reset" class="danger">Reset local data</button></div><p class="help">Exports contain schemaVersion, IDs, timestamps and audit history. Keep files until review is complete.</p>`)}}
function table(es,own=false){if(!es.length)return '<p class="empty">No activities yet.</p>';return `<div class="table-wrap"><table><thead><tr><th>Person</th><th>Activity</th><th>Date</th><th>Proof</th><th>Points</th><th>Status</th><th>Review / actions</th></tr></thead><tbody>${es.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{let a=activity(e);return `<tr><td>${esc(person(e))}</td><td>${esc(a.label)}<br><small>${esc(a.category)}</small></td><td>${esc(e.date)}</td><td>${esc(e.proof)}</td><td>${fmt(e.awardedPoints??e.points)}</td><td><span class="status ${e.status}">${e.status}</span></td><td>${e.reviewerComment?esc(e.reviewerComment)+'<br>':''}${own&&e.status==='Draft'?`<button class="secondary edit" data-id="${e.id}">Edit</button> <button class="danger delete" data-id="${e.id}">Delete</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
const review={
catalogue(){return layout('Catalogue manager',`<p>Catalogue version <strong>${db.catalogueVersion}</strong>. Deactivated activities remain in history but cannot be selected by contributors.</p><form id="catalogueForm" class="form-grid"><input type="hidden" name="id"><label>Category<input name="category" required></label><label>Label<input name="label" required></label><label>Points<input name="points" type="number" min="0" step="0.5" required></label><label>Unit<select name="unit"><option value="count">count</option><option value="day">day</option></select></label><label class="wide">Cap (optional)<input name="cap" placeholder="e.g. 2 per month, 5 per bid"></label><button class="primary">Save activity</button></form><div class="actions"><button id="catalogueExport" class="secondary">Export catalogue.json</button></div><div class="table-wrap"><table><thead><tr><th>Category</th><th>Activity</th><th>Points</th><th>Cap</th><th></th></tr></thead><tbody>${db.catalogue.map(a=>`<tr><td>${esc(a.category)}</td><td>${esc(a.label)} ${!a.active?'<span class="status Rejected">Inactive</span>':''}</td><td>${a.points}/${a.unit}</td><td>${esc(a.cap||'—')}</td><td><button class="secondary cat-edit" data-id="${a.id}">Edit</button> <button class="secondary cat-toggle" data-id="${a.id}">${a.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div>`)},
import(){return layout('Import contributor files',`<div id="drop" class="drop"><strong>Drop contributor JSON files here</strong><br>or <label class="secondary">choose files<input id="contributorFiles" type="file" multiple accept="application/json" hidden></label><p class="help">Files are validated before import. Existing IDs are kept and never silently overwritten.</p></div><div id="importResult"></div>`)},
queue(){let people=[...new Set(db.entries.map(person))],cats=[...new Set(db.entries.map(e=>activity(e).category))];return layout('Review queue',`<div class="filter-row"><select id="fPerson"><option value="">All people</option>${people.map(x=>`<option>${esc(x)}</option>`)}</select><select id="fGrade"><option value="">All grades</option>${Object.keys(TARGETS).map(x=>`<option>${x}</option>`)}</select><select id="fCat"><option value="">All categories</option>${cats.map(x=>`<option>${esc(x)}</option>`)}</select><input id="fMonth" type="month" min="2026-10" max="2026-12"><select id="fStatus"><option value="Submitted">Submitted</option><option value="">All statuses</option><option>Draft</option><option>Approved</option><option>Rejected</option></select><button id="applyFilters" class="secondary">Filter</button></div><div class="actions"><button id="bulkApprove" class="primary">Approve selected</button><button id="bulkReject" class="secondary">Reject selected</button></div><div id="queueTable"></div>`)},
merge(){let groups={};db.entries.forEach(e=>{let k=[person(e).toLowerCase(),e.activityId,e.date,(e.proof||'').toLowerCase().replace(/\W/g,'').slice(0,18)].join('|');(groups[k]??=[]).push(e)});let dup=Object.values(groups).filter(g=>g.length>1);let wins={};db.entries.filter(e=>/proposal won|framework contract|proposal shortlisted/i.test(activity(e).label)).forEach(e=>{let k=(e.proof||'').toLowerCase().trim();if(k)(wins[k]??=[]).push(e)});let team=Object.entries(wins).filter(([,g])=>new Set(g.map(person)).size>1);return layout('Merge & link review',`<p class="help">Likely duplicates share person, activity, date and similar proof. Team wins share a proposal proof across people. Linking records an audit note; merge retains the first item and archives the others.</p><h3>Likely duplicates</h3>${groupsHtml(dup,'duplicate')}<h3>Potential team wins</h3>${groupsHtml(team.map(x=>x[1]),'team win')}`)},
leaderboard(){let ps={};db.entries.forEach(e=>{let p=e.person||db.profile;if(p?.email)ps[p.email]=p});let rows=Object.values(ps).map(p=>{let e=db.entries.filter(x=>(x.person?.email||db.profile.email)===p.email),q=totalFor(e,p),t=target(p),v=Math.min(q.d/t.d,q.b/t.b)*100;return {p,q,v,league:['Analyst','Consultant'].includes(p.grade)?'Juniors':'Seniors'}}).sort((a,b)=>b.v-a.v);let avg=rows.length?rows.reduce((s,x)=>s+x.v,0)/rows.length:0;return layout('Leaderboard',`<div class="actions"><button id="anon" class="secondary">Toggle public display</button><button id="exportReviewed" class="primary">Export reviewed files per person</button><button id="exportMaster" class="secondary">Export master.json</button><button id="exportCSV" class="secondary">Export CSV</button></div><p><strong>Team average qualifying progress: ${fmt(avg)}%</strong></p><div id="leaderboard">${leaderHtml(rows,false)}</div>`)},
data(){return layout('Data safety',`<p>Master data is kept locally in this browser. Use the leaderboard exports for backup and exchange.</p><button id="reset" class="danger">Reset local data</button>`)} };
function groupsHtml(groups,kind){return groups.length?groups.map(g=>`<div class="card"><strong>${kind}: ${esc(g[0].proof)}</strong><ul>${g.map(e=>`<li>${esc(person(e))} · ${esc(e.date)} · ${esc(activity(e).label)} <button class="secondary link" data-ids="${g.map(x=>x.id).join(',')}">Link</button> <button class="danger merge" data-ids="${g.map(x=>x.id).join(',')}">Merge</button></li>`).join('')}</ul></div>`).join(''):'<p class="empty">No matches found.</p>'}
function leaderHtml(rows,anon){return ['Juniors','Seniors'].map(l=>`<h3>${l} · top 3</h3><div class="table-wrap"><table><thead><tr><th>#</th><th>Contributor</th><th>Grade</th><th>Delivery</th><th>Business</th><th>Qualifying %</th></tr></thead><tbody>${rows.filter(x=>x.league===l).slice(0,3).map((x,i)=>`<tr><td>${i+1}</td><td>${anon?'Contributor '+(i+1):esc(x.p.name)}</td><td>${esc(x.p.grade)}</td><td>${fmt(x.q.d)}</td><td>${fmt(x.q.b)}</td><td>${fmt(x.v)}%</td></tr>`).join('')||'<tr><td colspan="6">No approved results.</td></tr>'}</tbody></table></div>`).join('')}
function cap(a,quantity,d,editing){let list=db.entries.filter(e=>e.id!==editing&&e.activityId===a.id&&e.status!=='Rejected'),m=+(a.cap||'').match(/^\d+/)?.[0],scope=/per month/.test(a.cap)?'this month':/per bid/.test(a.cap)?'this bid':'the full game';if(a.category==='Internal life'){let used=db.entries.filter(e=>e.id!==editing&&e.status!=='Rejected'&&activity(e).category==='Internal life').reduce((s,e)=>s+(+e.points||0),0),allowed=Math.max(0,Math.min(quantity*a.points,10-used));return {points:allowed,warning:allowed<quantity*a.points?`Internal life is capped at 10 points for the full game; only ${fmt(allowed)} point(s) can be recorded.`:''}}if(!m)return {points:quantity*a.points,warning:''};let used=list.filter(e=>scope==='this month'?month(e.date)===month(d):scope==='this bid'?(e.proof||'').trim().toLowerCase()===$('#proof')?.value.trim().toLowerCase():true).reduce((s,e)=>s+(+e.quantity||0),0),allowed=Math.max(0,Math.min(quantity,m-used));return {points:allowed*a.points,warning:allowed<quantity?`Cap applied: ${fmt(m)} ${a.unit}(s) maximum ${scope}; only ${fmt(allowed)} ${a.unit}(s) can be recorded.`:''}}
function bind(){ $$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$$('.role-switch button').forEach(b=>{b.classList.toggle('active',b.dataset.role===role);b.onclick=()=>{role=b.dataset.role;tab=role==='contributor'?'dashboard':'catalogue';render()}});
if(tab==='add'){let sync=()=>{let c=$('#category').value,as=db.catalogue.filter(a=>a.active&&a.category===c),sel=$('#activity');let old=sel.value;sel.innerHTML=as.map(a=>`<option value="${a.id}">${esc(a.label)} (${a.points}/${a.unit})</option>`).join('');if(as.some(a=>a.id===old))sel.value=old;let a=activity({activityId:sel.value}),x=cap(a,+$('#quantity').value||0,$('#entryDate').value);$('#pointsPreview').textContent=fmt(x.points)+' point(s)';$('#capWarning').textContent=x.warning};$('#category').onchange=sync;$('#activity').onchange=sync;$('#quantity').oninput=sync;$('#entryDate').onchange=sync;sync();$('#activityForm').onsubmit=e=>{e.preventDefault();let a=activity({activityId:$('#activity').value}),x=cap(a,+$('#quantity').value,$('#entryDate').value);db.entries.push({id:id(),activityId:a.id,activity:{...a},date:$('#entryDate').value,quantity:+$('#quantity').value,proof:$('#proof').value.trim(),comment:$('#comment').value.trim(),points:x.points,status:'Draft',createdAt:now(),updatedAt:now(),person:{...db.profile}});save();toast(x.warning||'Draft saved.');tab='activities';render()}}
if(tab==='profile')$('#profileForm').onsubmit=e=>{e.preventDefault();db.profile=Object.fromEntries(new FormData(e.target));save();toast('Profile saved.');render()};
$('#goProfile')?.addEventListener('click',()=>{tab='profile';render()});
$$('.delete').forEach(b=>b.onclick=()=>{if(confirm('Delete this draft?')){db.entries=db.entries.filter(e=>e.id!==b.dataset.id);save();render()}});$$('.edit').forEach(b=>b.onclick=()=>{let e=db.entries.find(x=>x.id===b.dataset.id);if(!e)return;let q=prompt('Quantity',e.quantity);if(q===null)return;let proof=prompt('Short proof',e.proof);if(proof===null)return;e.quantity=+q;e.proof=proof;e.points=cap(activity(e),e.quantity,e.date,e.id).points;e.updatedAt=now();save();render()});
$('#exportSubmission')?.addEventListener('click',()=>{if(!db.profile.name||!db.profile.email)return toast('Save your profile before exporting.');let es=db.entries.filter(e=>(!e.person||e.person.email===db.profile.email)&&e.status==='Draft');if(!es.length)return toast('There are no draft activities to submit.');es.forEach(e=>{e.status='Submitted';e.submittedAt=now();e.updatedAt=now()});let data={schemaVersion:VERSION,app:SCHEMA,type:'contributor-submission',exportedAt:now(),profile:db.profile,entries:es,audit:db.audit};let names=db.profile.name.trim().split(/\s+/);dl(`${names.at(-1)||'surname'}_${names[0]||'firstname'}_${month(date())}.json`,JSON.stringify(data,null,2));save();toast('Submission exported and marked Submitted.');render()});
$('#mySubmissionFile')?.addEventListener('change',e=>readFiles(e.target.files,files=>{try{let x=valid(files[0],'contributor-submission');if(!x.profile||!Array.isArray(x.entries))throw Error('Submission is missing a profile or entries.');if(profileReady()&&x.profile.email!==db.profile.email&&!confirm('This submission belongs to a different email address. Import it into this browser anyway?'))return;let added=0;x.entries.forEach(entry=>{if(!entry.id||!entry.date||!entry.activityId)throw Error('An entry is missing id, date or activity.');if(!db.entries.some(e=>e.id===entry.id)){db.entries.push({...entry,person:entry.person||x.profile});added++}});if(!profileReady())db.profile=x.profile;save();toast(added+' submission entr'+(added===1?'y':'ies')+' imported.');render()}catch(err){toast(err.message)}}));
$('#catalogueFile')?.addEventListener('change',e=>readFiles(e.target.files,files=>{try{let x=valid(files[0],'catalogue');if(!Array.isArray(x.catalogue))throw Error('Catalogue is missing activities.');db.catalogue=x.catalogue;db.catalogueVersion=x.catalogueVersion||db.catalogueVersion;save();toast('Catalogue imported.');render()}catch(err){toast(err.message)}}));
$('#reviewedFile')?.addEventListener('change',e=>readFiles(e.target.files,files=>{try{let x=valid(files[0],'reviewed');let n=0;(x.entries||[]).forEach(z=>{let i=db.entries.findIndex(e=>e.id===z.id);if(i>=0){db.entries[i]={...db.entries[i],...z};n++}});save();toast(n+' reviewed entries updated.');render()}catch(err){toast(err.message)}}));
if(tab==='catalogue'){ $('#catalogueForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.points=+v.points;v.active=true;if(v.id){let i=db.catalogue.findIndex(a=>a.id===v.id);db.catalogue[i]={...db.catalogue[i],...v}}else{v.id=id();db.catalogue.push(v)}db.catalogueVersion++;save();toast('Catalogue saved.');render()};$$('.cat-edit').forEach(b=>b.onclick=()=>{let a=db.catalogue.find(x=>x.id===b.dataset.id),f=$('#catalogueForm');Object.entries(a).forEach(([k,v])=>f.elements[k]&&(f.elements[k].value=v));window.scrollTo({top:0,behavior:'smooth'})});$$('.cat-toggle').forEach(b=>b.onclick=()=>{let a=db.catalogue.find(x=>x.id===b.dataset.id);a.active=!a.active;db.catalogueVersion++;save();render()});$('#catalogueExport').onclick=()=>dl('catalogue.json',JSON.stringify({schemaVersion:VERSION,app:SCHEMA,type:'catalogue',catalogueVersion:db.catalogueVersion,exportedAt:now(),catalogue:db.catalogue},null,2))}
if(tab==='import'){let handle=f=>readFiles(f,files=>{let ok=[],bad=[];files.forEach(file=>{try{let x=valid(file,'contributor-submission');if(!x.profile||!Array.isArray(x.entries))throw Error('Profile or entries missing.');let added=0;x.entries.forEach(e=>{if(!e.id||!e.date||!e.activityId)throw Error('An entry is missing id, date or activity.');if(!db.entries.some(z=>z.id===e.id)){db.entries.push({...e,person:x.profile,status:e.status==='Approved'?'Approved':'Submitted'});added++}});ok.push(file.name+': '+added+' new entries')}catch(e){bad.push(file.name+': '+e.message)}});save();$('#importResult').innerHTML=`<p class="success">${ok.join('<br>')}</p><p class="error">${bad.join('<br>')}</p>`});$('#contributorFiles').onchange=e=>handle(e.target.files);let d=$('#drop');d.ondragover=e=>{e.preventDefault();d.style.background='#eeeafb'};d.ondragleave=()=>d.style.background='';d.ondrop=e=>{e.preventDefault();d.style.background='';handle(e.dataTransfer.files)}}
if(tab==='queue'){let draw=()=>{let p=$('#fPerson').value,g=$('#fGrade').value,c=$('#fCat').value,m=$('#fMonth').value,s=$('#fStatus').value;let es=db.entries.filter(e=>(!p||person(e)===p)&&(!g||e.person?.grade===g)&&(!c||activity(e).category===c)&&(!m||month(e.date)===m)&&(!s||e.status===s));$('#queueTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th><input id="all" type="checkbox" aria-label="Select all"></th><th>Person</th><th>Activity</th><th>Date</th><th>Proof</th><th>Points</th><th>Status</th><th>Decision</th></tr></thead><tbody>${es.map(e=>`<tr><td><input class="pick" type="checkbox" value="${e.id}"></td><td>${esc(person(e))}<br><small>${esc(e.person?.grade)}</small></td><td>${esc(activity(e).label)}</td><td>${e.date}</td><td>${esc(e.proof)}</td><td>${fmt(e.points)}</td><td><span class="status ${e.status}">${e.status}</span></td><td><button class="primary decide" data-id="${e.id}" data-v="Approved">Approve</button> <button class="danger decide" data-id="${e.id}" data-v="Rejected">Reject</button></td></tr>`).join('')}</tbody></table></div>`;$('#all')?.addEventListener('change',e=>$$('.pick').forEach(x=>x.checked=e.target.checked));$$('.decide').forEach(b=>b.onclick=()=>decision([b.dataset.id],b.dataset.v));};let decision=(ids,v)=>{let comment='';if(v==='Rejected'){comment=prompt('Reviewer comment is required for rejection:')||'';if(!comment.trim())return toast('A rejection comment is required.')}ids.forEach(i=>{let e=db.entries.find(x=>x.id===i);if(e){e.status=v;e.reviewerComment=comment;e.awardedPoints=e.points;e.audit=[...(e.audit||[]),{action:v,by:'Reviewer',at:now(),comment}]}});save();toast(ids.length+' entry/entries '+v.toLowerCase()+'.');draw()};$('#applyFilters').onclick=draw;$('#bulkApprove').onclick=()=>decision($$('.pick:checked').map(x=>x.value),'Approved');$('#bulkReject').onclick=()=>decision($$('.pick:checked').map(x=>x.value),'Rejected');draw()}
$$('.link').forEach(b=>b.onclick=()=>{b.dataset.ids.split(',').forEach(i=>{let e=db.entries.find(x=>x.id===i);e.audit=[...(e.audit||[]),{action:'Linked for team review',at:now()}]});save();toast('Entries linked in audit trail.')});$$('.merge').forEach(b=>b.onclick=()=>{let ids=b.dataset.ids.split(','),keep=ids.shift();ids.forEach(i=>{let e=db.entries.find(x=>x.id===i);e.status='Rejected';e.reviewerComment='Merged as duplicate into '+keep;e.audit=[...(e.audit||[]),{action:'Merged duplicate',at:now(),mergedInto:keep}]});save();toast('Duplicates archived; history retained.');render()});
if(tab==='leaderboard'){let anon=false;$('#anon').onclick=()=>{anon=!anon;let ps={};db.entries.forEach(e=>{let p=e.person||db.profile;if(p?.email)ps[p.email]=p});let rows=Object.values(ps).map(p=>{let q=totalFor(db.entries.filter(x=>(x.person?.email||db.profile.email)===p.email),p),t=target(p);return {p,q,v:Math.min(q.d/t.d,q.b/t.b)*100,league:['Analyst','Consultant'].includes(p.grade)?'Juniors':'Seniors'}}).sort((a,b)=>b.v-a.v);$('#leaderboard').innerHTML=leaderHtml(rows,anon)};$('#exportMaster').onclick=()=>dl('master.json',JSON.stringify({schemaVersion:VERSION,app:SCHEMA,type:'master',exportedAt:now(),catalogueVersion:db.catalogueVersion,catalogue:db.catalogue,entries:db.entries,audit:db.audit},null,2));$('#exportCSV').onclick=()=>{let h=['id','person','email','grade','date','category','activity','proof','points','status','reviewerComment'];let rows=db.entries.map(e=>[e.id,person(e),e.person?.email,e.person?.grade,e.date,activity(e).category,activity(e).label,e.proof,e.awardedPoints??e.points,e.status,e.reviewerComment]);dl('master.csv',[h,...rows].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};$('#exportReviewed').onclick=()=>{let people={};db.entries.forEach(e=>{let p=e.person||{};(people[p.email]??={p,entries:[]}).entries.push(e)});Object.values(people).forEach(x=>{let n=(x.p.name||'contributor').replace(/\s+/g,'_');dl(n+'_reviewed.json',JSON.stringify({schemaVersion:VERSION,app:SCHEMA,type:'reviewed',exportedAt:now(),profile:x.p,entries:x.entries},null,2))});toast('Reviewed files downloaded.')}}
$('#reset')?.addEventListener('click',()=>{if(confirm('Reset all Road to Target data in this browser? This cannot be undone.')){db=blank();save();toast('Local data reset.');render()}})}
function readFiles(files,done){Promise.all([...files].map(f=>f.text().then(t=>{try{return JSON.parse(t)}catch{throw Error(f.name+' is not valid JSON.')} }))).then(done).catch(e=>toast(e.message))}
render();
